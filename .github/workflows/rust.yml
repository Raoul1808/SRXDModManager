name: Build Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Installing musl rust toolchain
      run: rustup target add x86_64-unknown-linux-musl
    - name: Build release
      run: cargo build --bin installer --target x86_64-unknown-linux-musl --release
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: SRXDModManager-linux-musl
        path: target/x86_64-unknown-linux-musl/SRXDModManager
